name: SEO / GEO weekly article reminder

on:
  schedule:
    # Monday 01:00 UTC (≈ 09:00 Bali / Asia-Makassar)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get next topic
        id: topic
        run: |
          node scripts/seo-geo-next-topic.mjs > topic.json
          cat topic.json
          if jq -e '.ok == false' topic.json > /dev/null; then
            echo "has_topic=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_topic=true" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.next.title' topic.json)" >> "$GITHUB_OUTPUT"
          echo "slug=$(jq -r '.next.slug' topic.json)" >> "$GITHUB_OUTPUT"
          echo "query=$(jq -r '.next.targetQuery' topic.json)" >> "$GITHUB_OUTPUT"
          echo "type=$(jq -r '.next.type' topic.json)" >> "$GITHUB_OUTPUT"

      - name: Open reminder issue
        if: steps.topic.outputs.has_topic == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const topic = JSON.parse(fs.readFileSync('topic.json', 'utf8')).next;
            const body = `## Weekly SEO / GEO article task

            **Scheduled automation** — run the agent using the prompt in [\`.github/automation/seo-geo-weekly-article.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/automation/seo-geo-weekly-article.md).

            ### Next topic from queue

            | Field | Value |
            | --- | --- |
            | **Title** | ${topic.title} |
            | **Slug** | \`${topic.slug}\` |
            | **Type** | ${topic.type} |
            | **Target query** | ${topic.targetQuery} |
            | **Tour links** | ${(topic.tourLinks || []).join(', ')} |

            ### Quick commands

            \`\`\`bash
            node scripts/seo-geo-next-topic.mjs
            npm run build
            \`\`\`

            ### Checklist

            - [ ] New post in \`src/data/blog.ts\`
            - [ ] Update \`src/data/geoContent.ts\` (GEO_ARTICLES + GEO_UPDATED)
            - [ ] Internal links from 2+ existing posts
            - [ ] Mark topic \`published\` in \`article-topic-queue.json\`
            - [ ] \`npm run build\` passes
            - [ ] Draft PR to \`main\`

            ---
            *Auto-generated by seo-geo-article-schedule workflow.*
            `;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SEO/GEO] Publish article: ${topic.slug}`,
              body,
              labels: ['seo', 'content', 'automation'],
            });

      - name: No pending topics
        if: steps.topic.outputs.has_topic == 'false'
        run: echo "No pending topics — add more to .github/automation/article-topic-queue.json"
